name: E2E

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        type: choice
        options: [development, test]
        required: true
        default: development

permissions:
  contents: read

# One run per environment at a time: every run starts a demo, and demos are rate limited per IP.
concurrency:
  group: e2e-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      # Set per environment: Settings > Environments > <name> > Variables.
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ inputs.environment }}
          path: playwright-report/
          retention-days: 14