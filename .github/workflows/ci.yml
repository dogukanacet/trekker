name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run the same checks before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Install scripts can be blocked by npm, so generate the Prisma client explicitly.
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Critical only: the remaining high finding (postcss bundled inside Next) has no fix on Next 15.
      - run: npm audit --omit=dev --audit-level=critical

  integration:
    needs: checks
    # Every run gets its own Postgres schema on the shared Neon branch,
    # so runs can execute in parallel and nothing has to queue or get cancelled.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Create isolated schema and write .env.test
        run: |
          schema="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "TEST_SCHEMA=${schema}" >> "$GITHUB_ENV"
          # psql does not understand Prisma's ?schema= parameter, so it gets the plain URL.
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS ${schema}"
          sep='?'
          case "$TEST_DATABASE_URL" in *\?*) sep='&' ;; esac
          printf 'DATABASE_URL="%s%sschema=%s"\nINTEGRATION_TEST_DB=1\n' \
            "$TEST_DATABASE_URL" "$sep" "$schema" > .env.test
      - name: Migrate
        env:
          # Safe: this schema is private to the run, so no other migration can race with it.
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: npm run test:db:migrate
      - run: npm run test:integration
      - name: Drop schema
        if: always()
        run: psql "$TEST_DATABASE_URL" -c "DROP SCHEMA IF EXISTS ${TEST_SCHEMA} CASCADE"
