name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-development:
    needs: ci
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      ref: ${{ github.event.release.tag_name }}
    secrets: inherit

  # Smoke and accessibility checks against the freshly deployed development environment.
  e2e-development:
    needs: deploy-development
    uses: ./.github/workflows/e2e.yml
    with:
      environment: development
    secrets: inherit